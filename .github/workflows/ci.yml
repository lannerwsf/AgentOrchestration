name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      # Pin actions to immutable commit SHAs for supply-chain security.
      # Update by finding the latest release tag, resolving its SHA, and
      # replacing the old SHA below. This ensures CI always runs a
      # reviewed version of each action.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370f7bcb16953c6d4d6f4339cf36e # v7.6.0
      - name: Install dependencies
        run: uv sync
      - name: Validate action pinning
        run: uv run python scripts/validate_action_pins.py
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/
